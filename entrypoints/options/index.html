<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SurfWarden · 设置</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
             color: #1f2328; background: #f9fafb; }
      .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
      h1 { font-size: 20px; } h2 { font-size: 15px; margin: 0 0 10px; }
      section { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f3f4f6; }
      input, select { font: inherit; padding: 4px 8px; border: 1px solid #e5e7eb; border-radius: 8px; }
      input[type="text"], input[type="number"], input[type="url"] { width: 100%; }
      .btn { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 9px; border: 1px solid #e5e7eb;
             background: #fff; cursor: pointer; }
      .btn:hover:not(:disabled) { background: #f3f4f6; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-primary { background: #16a34a; border-color: #16a34a; color: #fff; font-weight: 600; }
      .btn-primary:hover:not(:disabled) { background: #15803d; }
      .btn-danger { color: #b91c1c; border-color: #fecaca; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .grow { flex: 1; }
      .muted { color: #6b7280; font-size: 12px; }
      .ok { color: #16a34a; font-size: 13px; }
      .warn { color: #b45309; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
      label.field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #6b7280; }
      code { background: #f3f4f6; padding: 1px 5px; border-radius: 5px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

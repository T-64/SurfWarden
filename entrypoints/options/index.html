<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SurfWarden · 设置</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); }
      .wrap { max-width: 880px; margin: 0 auto; padding: 28px 16px 64px; }
      h1 { font: 600 20px/1.3 var(--sans); color: var(--ink); margin: 0 0 4px; }
      h1 span { color: var(--green); }
      .sub { font-size: 12px; color: var(--mute); margin: 0 0 18px; }
      section {
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
        padding: 18px 20px; margin-bottom: 14px;
      }
      h2 {
        font: 600 13px/1.4 var(--sans); color: var(--ink); margin: 0 0 10px;
        display: flex; align-items: center; gap: 8px;
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th {
        text-align: left; font: 600 11px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--mute); padding: 8px; border-bottom: 1px solid var(--line);
      }
      td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
      tr:last-child td { border-bottom: none; }
      input, select {
        font: 400 13px/1.4 var(--sans);
        background: var(--elevated); color: var(--ink);
        border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; width: 100%;
      }
      input:focus, select:focus { outline: none; border-color: var(--faint); }
      input[type='checkbox'] { width: auto; accent-color: var(--green); }
      input[type='text'] { font-family: var(--mono); font-size: 12px; }
      .btn {
        display: inline-flex; align-items: center; gap: 6px;
        font: 600 13px/1 var(--sans); padding: 8px 14px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--elevated); color: var(--body); cursor: pointer;
      }
      .btn:hover:not(:disabled) { background: var(--card); color: var(--ink); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-primary { background: #ffffff; color: #000; border-color: #fff; }
      .btn-primary:hover:not(:disabled) { background: #e8e8e8; }
      .btn-danger { color: var(--red); border-color: rgba(255, 92, 92, 0.3); background: transparent; }
      .btn-danger:hover:not(:disabled) { background: var(--red-soft); color: var(--red); }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
      .grow { flex: 1; }
      .muted { color: var(--mute); font-size: 12px; margin: 6px 0 0; }
      .ok { color: var(--green); font-size: 13px; }
      .warn { color: var(--amber); font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
      label.field { display: flex; flex-direction: column; gap: 4px; font: 600 11px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
      code { background: var(--elevated); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; font-size: 12px; font-family: var(--mono); }
    </style>
  </head>
  <body>
    <div id="root" class="od-app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SurfWarden</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 320px; margin: 0; padding: 14px 16px;
        font: 13px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2328; background: #fff;
      }
      header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
      h1 { font-size: 15px; margin: 0; }
      h2 { font-size: 12px; color: #6b7280; margin: 12px 0 4px; font-weight: 600; }
      .sub { font-size: 12px; color: #6b7280; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
      .ringrow { display: flex; align-items: center; gap: 12px; }
      .ringlabel { font-size: 12px; fill: #374151; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .time { color: #6b7280; font-variant-numeric: tabular-nums; }
      .empty { color: #6b7280; margin: 16px 0; }
      .budget { margin-top: 10px; }
      .budget-head { display: flex; justify-content: space-between; font-size: 12px; color: #374151; }
      .meter { height: 8px; border-radius: 999px; background: #f3f4f6; overflow: hidden; margin-top: 4px; }
      .meter > i { display: block; height: 100%; border-radius: 999px; transition: width 0.3s; }
      .current { margin-top: 12px; border-top: 1px solid #f3f4f6; padding-top: 10px; }
      .cur-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .chip { color: #fff; font-size: 11px; padding: 1px 8px; border-radius: 999px; flex: none; }
      .mini { font-size: 12px; color: #374151; background: #f9fafb; border: 1px solid #e5e7eb;
              border-radius: 8px; padding: 5px 10px; cursor: pointer; margin-right: 6px; }
      .mini:hover:not(:disabled) { background: #f3f4f6; }
      .mini:disabled { opacity: 0.5; cursor: wait; }
      footer { margin-top: 12px; font-size: 11px; color: #9ca3af; border-top: 1px solid #f3f4f6;
               padding-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

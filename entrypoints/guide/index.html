<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SurfWarden · 歇一下</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font: 15px/1.8 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f2328; background: linear-gradient(180deg, #f9fafb, #f3f4f6);
      }
      .card { width: 520px; max-width: calc(100vw - 32px); background: #fff; border-radius: 16px;
              box-shadow: 0 12px 48px rgba(0,0,0,0.08); padding: 28px 32px; }
      .tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; color: #fff; }
      h1 { font-size: 20px; margin: 10px 0 4px; }
      .sub { color: #6b7280; font-size: 13px; margin-bottom: 14px; }
      .meter { height: 10px; border-radius: 999px; background: #f3f4f6; overflow: hidden; margin: 8px 0 4px; }
      .meter > i { display: block; height: 100%; border-radius: 999px; }
      .stat { font-size: 13px; color: #374151; }
      .targets { margin: 18px 0 6px; display: flex; flex-direction: column; gap: 8px; }
      .btn { display: block; text-align: center; text-decoration: none; cursor: pointer;
             border-radius: 10px; padding: 11px 16px; font-size: 14px; border: 1px solid transparent; }
      .btn-primary { background: #16a34a; color: #fff; font-weight: 600; }
      .btn-primary:hover { background: #15803d; }
      .btn-ghost { background: #fff; color: #374151; border-color: #e5e7eb; }
      .btn-ghost:hover { background: #f9fafb; }
      .row { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
      .btn-mini { font-size: 12px; color: #6b7280; background: none; border: 1px solid #e5e7eb;
                  border-radius: 8px; padding: 6px 10px; cursor: pointer; }
      .btn-mini:hover:not(:disabled) { background: #f9fafb; }
      .btn-mini:disabled { opacity: 0.45; cursor: not-allowed; }
      .hint { font-size: 12px; color: #9ca3af; margin-top: 10px; }
      .empty { color: #6b7280; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
